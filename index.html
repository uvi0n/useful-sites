<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>free-webtools | Полезные сайты</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>
<body>

    <!-- Рекламная плашка -->
    <div class="ad-banner" id="adBanner">
        <span id="adText">Нашли ошибку? Хотите добавть сайт? По вопросам рекламы: </span>
        <a href="mailto:inianovbob@gmail.com" class="ad-link">inianovbob@gmail.com</a>
    </div>

    <!-- Закрепленная шапка -->
    <header class="header">
    <div class="header-content">
        <div class="logo">🚀 free-webtools</div>
        <div class="search-wrapper">
            <input type="text" class="search-box" id="searchInput" placeholder="Поиск инструментов...">
        </div>
        <div class="header-controls">
            <button class="icon-btn" id="langToggle">🇷🇺 RU</button>
            <button class="icon-btn" id="themeToggle">🌓</button>
        </div>
    </div>
    
    <div class="filters-container" id="filters"></div>
    <div class="filters-container price-filters" id="priceFilters"></div>
</header>

    <!-- Сетка карточек -->
    <main class="container" id="sites-container"></main>

    <!-- Детальный просмотр (скрыт по умолчанию) -->
    <div id="detail-view" class="detail-view hidden">
        <button class="icon-btn" id="backBtn">⬅ Назад / Back</button>
        <div id="detail-content" class="detail-content"></div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
