<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeToolsHub | Полезные сайты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Рекламная плашка -->
    <div class="ad-banner" id="adBanner">
        <span id="adText">По вопросам рекламы: </span>
        <a href="mailto:твоя@почта.com" class="ad-link">твоя@почта.com</a>
    </div>

    <!-- Закрепленная шапка -->
    <header class="header">
        <div class="header-content">
            <div class="logo" id="logoText">🚀 FreeToolsHub</div>
            
            <div class="search-wrapper">
                <input type="text" class="search-box" id="searchInput" placeholder="Поиск по названию, теме, тегам...">
            </div>

            <div class="header-controls">
                <button class="icon-btn" id="langToggle" title="Сменить язык">🇷🇺 RU</button>
                <button class="icon-btn" id="themeToggle" title="Переключить тему">🌓</button>
            </div>
        </div>
        
        <!-- Панель фильтров -->
        <div class="filters-container" id="filters"></div>
    </header>

    <!-- Сетка карточек и скрытый экран -->
    <main class="container" id="sites-container">
        
        <!-- Детальный просмотр (скрыт по умолчанию) -->
        <div id="detail-view" class="detail-view hidden">
            <button class="icon-btn" id="backBtn">⬅ Назад / Back</button>
            <div id="detail-content" class="detail-content"></div>
        </div>
        
    </main>

    <!-- Подключаем логику и базу данных -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
