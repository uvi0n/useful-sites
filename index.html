<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>free-webtools | Полезные сайты и нейросети</title>
    
    <meta name="description" content="Огромная коллекция бесплатных нейросетей, инструментов для дизайна, разработки и учебы.">
    <meta property="og:title" content="free-webtools | Лучшие бесплатные инструменты">
    <meta property="og:description" content="Сборник топовых сервисов для работы, учебы и дизайна.">
    <meta property="og:image" content="https://uvi0n.github.io/free-webtools.ru/preview.jpg"> <meta property="og:url" content="https://uvi0n.github.io/free-webtools.ru/">
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    
    </head>
<body>

    <header class="header">
        <div class="header-content">
            <div class="logo" onclick="window.location.hash=''; window.location.reload();" style="cursor:pointer;">🚀 free-webtools</div>
            
            <div id="statsCounter" class="stats-counter"></div>
            
            <div id="likesLoader" class="stats-counter pulse-loader">⏳ Лайки...</div>
            <div class="search-wrapper">
                <input type="text" class="search-box" id="searchInput" placeholder="Поиск (название, теги)...">
            </div>
            
            <div class="header-controls">
                <button class="icon-btn" id="suggestBtn" title="Предложить сайт">💡</button>
                <button class="icon-btn" id="stackBtn" title="Мои кастомные стеки">📦</button>
                <button class="icon-btn" id="likesBtn" title="Мои лайки">❤️</button>
                <button class="icon-btn" id="bookmarksBtn" title="Мои закладки">⭐</button>
                <button class="icon-btn" id="langToggle">RU</button>
                <button class="icon-btn" id="themeToggle">🌓</button>
            </div>
        </div>
        
        <div class="filters-container" id="filters"></div>
        <div class="filters-container price-filters" id="priceFilters"></div>
    </header>

    <div class="sort-container" id="sortContainer">
        <div class="sort-left">
            <span class="sort-label">Сортировка:</span>
            <button class="sort-btn active" data-sort="default">По умолчанию</button>
             <button class="sort-btn" data-sort="top">🔥 Топ (по лайкам)</button>
            <button class="sort-btn" data-sort="popular">⚡️ Популярные</button>
        </div>

        <div id="stackManagerPanel" class="sort-container hidden" style="margin-top: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
    <div class="sort-left">
        <span class="sort-label" id="stackLabel">Текущий стек:</span>
        <select id="stackSelect" class="sort-btn" style="padding: 8px 12px; cursor: pointer; outline: none; border-color: var(--border-color);"></select>
        <button class="filter-btn" id="createStackBtn" style="background: var(--accent-color); color: #fff;">+ Создать стек</button>
        <button class="filter-btn" id="deleteStackBtn" style="background: #ff3b30; color: #fff; padding: 8px 12px;">🗑️</button>
    </div>
    <div class="sort-right">
        <button class="filter-btn active" id="shareStackBtn">🔗 Поделиться этим стеком</button>
    </div>
</div>
        
        <div class="sort-right">
            <button class="icon-btn small-btn" id="viewToggle" title="Сменить вид (Сетка / Список)">📋</button>
            <button class="icon-btn small-btn" id="randomBtn" title="Случайный сайт">🎲</button>
            <button class="icon-btn small-btn" id="changelogBtn" title="Обновления">📜</button>
        </div>
    </div>

    <section id="collections-container" class="container collections-grid hidden"></section>

    <main class="container" id="sites-container"></main>

    <div id="detail-view" class="detail-view hidden">
        <button class="icon-btn" id="backBtn">⬅ Назад / Back</button>
        <div id="detail-content" class="detail-content"></div>
        <h3 id="similar-title" style="margin-top: 40px; text-align: center;">Похожие инструменты</h3>
        <div id="similar-tools" class="container" style="margin-top: 20px;"></div>
    </div>

    <dialog id="suggestModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeSuggest">×</span>
            <h2>Предложить инструмент</h2>
            <form action="https://formspree.io/f/mrejnrey" method="POST" id="suggestForm">
                <input type="text" name="Название" placeholder="Название сайта" required>
                <input type="url" name="Ссылка" placeholder="https://..." required>
                <textarea name="Описание" placeholder="Почему его стоит добавить?" required></textarea>
                <button type="submit" class="btn">Отправить</button>
            </form>
        </div>
    </dialog>

    <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-box" placeholder="Поиск (имя, теги)..." autocomplete="off">
                <div class="quick-tags">
                    <span class="quick-tag" data-tag="ai">#Нейросети</span>
                    <span class="quick-tag" data-tag="dota2">#Dota2</span>
                    <span class="quick-tag" data-tag="cs2">#CS2</span>
                    <span class="quick-tag" data-tag="математика">#Учеба</span>
                    <span class="quick-tag" data-tag="nocode">#NoCode</span>
                </div>
            </div>

    <dialog id="changelogModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeChangelog">×</span>
            <h2>История обновлений</h2>
            <ul id="changelogList" class="changelog-list"></ul>
        </div>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js"></script>

    <footer class="site-footer">
        <p>Сделано с ❤️ | <a href="https://yoomoney.ru/" target="_blank" class="donate-btn">☕ Поддержать автора</a></p>
    </footer>

    <dialog id="rouletteModal" class="modal" style="max-width: 700px;">
    <div class="modal-content" style="overflow: hidden; padding: 40px 20px; text-align: center;">
        <h3 id="rouletteTitle" style="margin-bottom: 20px;">🎲 Открытие кейса инструментов...</h3>
        <div class="roulette-wrapper">
            <div class="roulette-pointer"></div>
            <div id="rouletteTrack" class="roulette-track"></div>
        </div>
    </div>
</dialog>
    
</body>
</html>
